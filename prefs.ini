# prefs.ini - what data you want. Edit by hand, run `python3 kit.py ask`, or let your AI agent fill it in.
# All times are New York time. Dates are YYYYMMDD. Lines starting with # are comments.

[data]
# where to look for captures (read-only). auto = the usual data folders on the VM (/db_pcaps, /md, /data, ...).
# Or list folders, e.g.  roots = /db_pcaps, /some/new/folder/the/professor/added
# Any folder layout and any file names work: scan reads the packets to find the exchange and start time.
roots = auto

[request]
# nasdaq, cme, iex (comma list)
venues = nasdaq, cme
# Nasdaq symbols, comma list, or a file name such as symbols.txt (one per line)
symbols = QQQ, TQQQ, SQQQ
# CME instruments: NAME=SecurityID, optional @first_date for contract rolls.
# The course captures carry no instrument definitions; find ids with: python3 kit.py discover-cme --date YYYYMMDD
cme_instruments = NQH5=42288528, NQM5=42005804@20250317
# CME index prices arrive 100x too large; 0.01 fixes that
cme_price_factor = 0.01
from = 20250203
to = 20250207
# days of the week to include
weekdays = mon, tue, wed, thu, fri
# dates to leave out (holidays, known gaps), comma list
skip_dates = 20250217
start = 18:00
end = 20:00
# Nasdaq order books are rebuilt from this time so they are complete at the window start
book_from = 04:00

[output]
# bar sizes in minutes, comma list (empty = no bars)
bars = 1
# yes = also write every quote and trade inside the window
ticks = yes
out_dir = out

[limits]
# professor's rule: never more than 32 threads in total
max_threads = 32
# do not start if free disk would drop below this (GB); the VM disk is shared
min_free_gb = 5
# stop and ask if the output folder grows beyond this (GB)
max_out_gb = 10
